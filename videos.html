<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos — Wolfthump</title>
  <meta name="description" content="Videos of Wolfthump, Chico's Afro-Brazilian drum-funk drumline.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/default.css?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

  <header class="page-header">
    <a class="page-header-logo" href="./" aria-label="Wolfthump home page">
      <img src="img/wolfthump_logo.png" alt="">
    </a>
  </header>

  <section class="videos-section">
    <div class="container">
      <h1 class="section-label">Videos</h1>

      <p class="videos-status" id="videos-status" role="status">Loading videos…</p>
      <div class="video-list" id="video-list"></div>

      <a class="form-button youtube-button" href="https://www.youtube.com/@wolfthumpgrooves" target="_blank" rel="noopener">See us on YouTube</a>
      <a class="back-link" href="./">← Back to the home page</a>
    </div>
  </section>

  <footer>
    <p>© 2026 Wolfthump &nbsp;·&nbsp; Chico, California &nbsp;·&nbsp; For the Love of the Groove</p>
  </footer>

  <template id="video-card-template">
    <article class="video-card">
      <div class="video-frame">
        <iframe loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
      </div>
      <div class="video-card-body">
        <h2 class="video-title"></h2>
        <p class="video-meta" hidden></p>
      </div>
    </article>
  </template>

  <script>
  // Video list from the Worker's GET /videos (worker/videos.mjs): the YouTube
  // "Featured" playlist, in playlist order. TECH_DESIGN "Videos".
  //
  // Each card is YouTube's own player, not a thumbnail we swap out on a tap:
  // iPhones only play sound when the tap lands on the player itself, so a
  // swapped-in player needed a second tap (Bill's phone, 2026-11-19).
  (function () {
    // Locally the preview server answers /videos itself (the Worker only allows
    // the real site's address), so the page can be checked before it's pushed.
    var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var VIDEOS_URL = LOCAL ? '/videos' : 'https://wolfthump-contact.bparnell.workers.dev/videos';
    var ID_RE = /^[\w-]{6,20}$/;
    var list = document.getElementById('video-list');
    var status = document.getElementById('videos-status');
    var template = document.getElementById('video-card-template');

    // One video at a time: YouTube's player API tells us when one starts, and
    // we pause the rest. If the API script fails to load, the players still
    // work; two could just play at once.
    var frames = [], players = [], apiReady = false;
    function attach(iframe) {
      var player = new YT.Player(iframe, {
        events: {
          onStateChange: function (e) {
            if (e.data !== YT.PlayerState.PLAYING) return;
            players.forEach(function (p) {
              if (p !== player && p.pauseVideo && p.getPlayerState && p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo();
            });
          }
        }
      });
      players.push(player);
    }
    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      frames.forEach(attach);
    };

    function render(videos) {
      videos.forEach(function (video) {
        if (!ID_RE.test(video.id)) return;
        var card = template.content.firstElementChild.cloneNode(true);
        var iframe = card.querySelector('iframe');
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + video.id +
          '?rel=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
        iframe.title = video.title;
        // Our own full title too: on a phone YouTube cuts its title off before
        // the song name, which is what tells these videos apart. No upload
        // date: it isn't the show date. Other channels' videos get a credit.
        card.querySelector('.video-title').textContent = video.title;
        if (!video.ours && video.channel) {
          var meta = card.querySelector('.video-meta');
          meta.textContent = 'Posted by ' + video.channel;
          meta.hidden = false;
        }
        list.appendChild(card);
        frames.push(iframe);
        if (apiReady) attach(iframe);
      });
    }

    function fail() {
      status.textContent = "Sorry, the videos didn't load. You can watch them all on our YouTube channel.";
    }

    fetch(VIDEOS_URL)
      .then(function (res) { return res.json(); })
      .then(function (out) {
        if (!out.ok || !out.videos || !out.videos.length) return fail();
        status.hidden = true;
        render(out.videos);
      })
      .catch(fail);
  })();
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>

</body>
</html>
